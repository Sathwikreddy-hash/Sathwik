<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sathwik — Developer Portfolio</title>
    <meta name="description" content="Minimalist, responsive personal portfolio website for 15-year-old developer Sathwik." />
    <meta property="og:title" content="Sathwik — Developer Portfolio" />
    <meta property="og:description" content="Minimalist, responsive personal portfolio website for 15-year-old developer Sathwik." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- High priority critical image preloads for instant header & profile display -->
    <link
      rel="preload"
      as="image"
      href="/assets/aistudio/d3936e4fbde0a7ac6821a91eaa002255__1__deed5026.jpg"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="image"
      href="/assets/aistudio/IMG_20261025_145024_a0e4a20f.jpg"
      fetchpriority="high"
    />
    <script>
      // Immediately prime browser memory cache
      (function() {
        try {
          const b = new Image();
          b.fetchPriority = 'high';
          b.src = '/assets/aistudio/d3936e4fbde0a7ac6821a91eaa002255__1__deed5026.jpg';
          const a = new Image();
          a.fetchPriority = 'high';
          a.src = '/assets/aistudio/IMG_20261025_145024_a0e4a20f.jpg';
        } catch (e) {}
      })();
    </script>
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          const theme =
            localStorage.getItem('portfolio-theme') ||
            (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-zinc-50 text-zinc-900 dark:bg-[#0c0e14] dark:text-zinc-100 antialiased selection:bg-zinc-200 dark:selection:bg-zinc-800 transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
